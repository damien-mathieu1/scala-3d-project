<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scala 3D Apps</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1a; overflow: hidden; font-family: system-ui, sans-serif; color: white; }
    #canvas-container { position: fixed; inset: 0; }

    /* ── MENU ─────────────────────────────────────────────────────────── */
    #panel-menu {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
    }
    #panel-menu h1 { font-size: 36px; margin-bottom: 12px; letter-spacing: 2px; opacity: 0.9; }
    .menu-card {
      width: 320px; padding: 28px 32px; border-radius: 16px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      transition: all 0.2s; text-align: center;
    }
    .menu-card:hover { background: rgba(255,255,255,0.15); transform: translateY(-3px); }
    .menu-card .icon { font-size: 48px; display: block; margin-bottom: 10px; }
    .menu-card h2 { font-size: 22px; margin-bottom: 6px; }
    .menu-card p { font-size: 14px; opacity: 0.6; }

    /* ── SHARED BACK BUTTON ───────────────────────────────────────────── */
    .back-btn {
      position: fixed; top: 16px; left: 16px; z-index: 30;
      padding: 8px 18px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.4); color: white; cursor: pointer; font-size: 14px;
      backdrop-filter: blur(6px); transition: background 0.15s;
      display: none;
    }
    .back-btn:hover { background: rgba(255,255,255,0.15); }

    /* ── BLACKJACK ────────────────────────────────────────────────────── */
    #panel-blackjack { display: none; }

    #scores {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 32px; z-index: 10; pointer-events: none;
    }
    .score {
      padding: 8px 20px; border-radius: 8px;
      background: rgba(0,0,0,0.5); color: #f0f0f0;
      font-size: 18px; font-weight: bold; backdrop-filter: blur(6px);
    }
    #dealer-score { color: #ffd700; }
    #result-msg {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 42px; font-weight: bold;
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
      pointer-events: none; z-index: 10; min-height: 1em;
    }
    #controls-bj {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px; z-index: 10;
    }
    #label-player, #label-dealer {
      position: fixed; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.4); font-size: 13px; pointer-events: none; z-index: 10;
    }
    #label-dealer { top: 58px; }
    #label-player { bottom: 88px; }

    /* ── IMAGE VIEWER ─────────────────────────────────────────────────── */
    #panel-viewer { display: none; }

    #controls-viewer {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 10;
    }
    #hint {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.35); font-size: 12px; pointer-events: none;
    }

    /* ── SHARED BUTTON STYLES ─────────────────────────────────────────── */
    button {
      padding: 12px 28px; border-radius: 8px; border: none; cursor: pointer;
      font-size: 16px; font-weight: bold; transition: all 0.15s;
    }
    #btn-hit   { background: #2ecc71; color: white; }
    #btn-stand { background: #e74c3c; color: white; }
    #btn-new   { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); }
    button:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-1px); }
    button:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    .shape-btn {
      padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1); color: white; font-size: 14px;
      backdrop-filter: blur(10px);
    }
    .shape-btn.active { background: rgba(99,102,241,0.75); border-color: rgba(99,102,241,0.9); }
    label.shape-btn { cursor: pointer; }
    #viewer-file { display: none; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- ── MENU ── -->
  <div id="panel-menu">
    <h1>🎮 Scala 3D</h1>
    <div class="menu-card" id="menu-btn-blackjack">
      <span class="icon">🃏</span>
      <h2>Blackjack</h2>
      <p>ADT · State monad · IO · Typeclasses</p>
    </div>
    <div class="menu-card" id="menu-btn-viewer">
      <span class="icon">🖼️</span>
      <h2>Visionneur 3D</h2>
      <p>Importe une image et visualise-la en 3D</p>
    </div>
  </div>

  <!-- ── BLACKJACK ── -->
  <div id="panel-blackjack">
    <button class="back-btn" id="back-from-blackjack" style="display:block">← Menu</button>
    <div id="scores">
      <span class="score" id="dealer-score">Dealer: 0</span>
      <span class="score" id="player-score">Joueur: 0</span>
    </div>
    <div id="result-msg"></div>
    <div id="label-dealer">Dealer</div>
    <div id="label-player">Joueur</div>
    <div id="controls-bj">
      <button id="btn-hit">Carte</button>
      <button id="btn-stand">Rester</button>
      <button id="btn-new">Nouvelle partie</button>
    </div>
  </div>

  <!-- ── IMAGE VIEWER ── -->
  <div id="panel-viewer">
    <button class="back-btn" id="back-from-viewer" style="display:block">← Menu</button>
    <div id="controls-viewer">
      <label for="viewer-file" class="shape-btn">📁 Ouvrir image</label>
      <input type="file" id="viewer-file" accept="image/*">
      <button class="shape-btn active" id="viewer-btn-plane">Plan</button>
      <button class="shape-btn" id="viewer-btn-box">Cube</button>
      <button class="shape-btn" id="viewer-btn-sphere">Sphère</button>
    </div>
    <p id="hint">Clic + glisser pour tourner · Molette pour zoomer · Clic droit pour déplacer</p>
  </div>

  <script src="./image3d-fastopt-bundle.js"></script>
</body>
</html>
